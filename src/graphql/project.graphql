query Project($projectId: Float!, $chainId: Float!, $version: Float!) {
  project(projectId: $projectId, chainId: $chainId, version: $version) {
    projectId
    metadataUri
    handle
    createdAt
    suckerGroupId
    owner
    volume
    paymentsCount
    tokenSupply
    name
  }
}

query ParticipantSnapshotsInRange($where: participantSnapshotFilter) {
  participantSnapshots(where: $where, limit: 1000, orderBy: "timestamp", orderDirection: "asc") {
    items {
      volume
      timestamp
    }
  }
}

query Projects($where: projectFilter) {
  projects(where: $where) {
    items {
      projectId
      metadataUri
      handle
      createdAt
      suckerGroupId
      participants {
        totalCount
      }
    }
  }
}

query ProjectAccountingContext($chainId: Float!, $projectId: Float!, $version: Float!) {
  project(chainId: $chainId, projectId: $projectId, version: $version) {
    token
    decimals
    currency
  }
}

query ProjectWithPermissions($projectId: Float!, $chainId: Float!, $version: Float!) {
  project(projectId: $projectId, chainId: $chainId, version: $version) {
    projectId
    chainId
    version
    owner
    permissionHolders {
      items {
        account
        operator
        permissions
      }
    }
  }
}